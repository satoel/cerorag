# Validation only: no cloud credentials here (CLAUDE.md: Actions is CI/CD only).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.13.2

jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zero-charge cost guardrails (R2, OCI)
        run: scripts/check-cost-guardrails.sh infra

  tofu-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [bootstrap, oci, cloudflare, google, azure, aws, aiven]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: fmt
        run: tofu fmt -check -recursive -diff
        working-directory: infra/${{ matrix.module }}
      - name: init (no backend)
        run: tofu init -backend=false -input=false -lockfile=readonly
        working-directory: infra/${{ matrix.module }}
      - name: validate
        run: tofu validate
        working-directory: infra/${{ matrix.module }}

  iac-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum-verified)
        run: scripts/install-ci-tools.sh "$RUNNER_TEMP/bin" tflint trivy && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: trivy config
        run: trivy config --exit-code 1 --skip-dirs '**/.terraform' .


  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: scripts/install-ci-tools.sh "$RUNNER_TEMP/bin" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        run: gitleaks git --redact --verbose .

  workers:
    # npm workspace: quota-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
